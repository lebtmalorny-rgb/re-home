---
- name: Live DB JSONL | verify HMAC and exact query coverage before SQL
  ansible.builtin.command:
    argv:
      - python3
      - "{{ live_discovery_side_remote_dir }}/scripts/collect_live_control.py"
      - --phase
      - verify
      - --side
      - "{{ live_discovery_schema_side }}"
      - --api-result
      - "{{ live_discovery_side_remote_dir }}/api/api-result.json"
      - --information-schema
      - "{{ live_discovery_side_remote_dir }}/information-schema.tsv"
      - --phase-key-file
      - "{{ live_discovery_side_remote_dir }}/protected/phase-hmac.key"
      - --out
      - "{{ live_discovery_side_remote_dir }}/sql"
  changed_when: false
  no_log: true

- name: Live DB JSONL | load generated query plan
  ansible.builtin.slurp:
    src: "{{ live_discovery_side_remote_dir }}/api/db-query-plan.json"
  register: live_discovery_db_query_plan_raw
  no_log: true

- name: Live DB JSONL | load HMAC-bound verified marker
  ansible.builtin.slurp:
    src: "{{ live_discovery_side_remote_dir }}/sql/verified-plan.json"
  register: live_discovery_db_verified_marker_raw
  no_log: true

- name: Live DB JSONL | decode exact Task 10 query plan
  ansible.builtin.set_fact:
    live_discovery_db_query_plan: >-
      {{ live_discovery_db_query_plan_raw.content | b64decode | from_json }}
  no_log: true

- name: Live DB JSONL | decode verified marker
  ansible.builtin.set_fact:
    live_discovery_db_verified_marker: >-
      {{ live_discovery_db_verified_marker_raw.content | b64decode | from_json }}
  no_log: true

- name: Live DB JSONL | validate plan envelope and side
  ansible.builtin.assert:
    that:
      - live_discovery_db_query_plan.schema_version == 'openstack-rehome-db-query-plan/v1alpha1'
      - live_discovery_db_query_plan.side == live_discovery_schema_side
      - live_discovery_db_query_plan.queries | length > 0
      - live_discovery_db_verified_marker.schema_version == 'openstack-rehome-verified-plan/v1alpha1'
      - live_discovery_db_verified_marker.side == live_discovery_schema_side
      - live_discovery_db_verified_marker.binding_sha256 == live_discovery_db_query_plan.binding_sha256
      - live_discovery_db_verified_marker.query_ids == (live_discovery_db_query_plan.queries | map(attribute='query_id') | list)

- name: Live DB JSONL | bind verified marker to exact plan digest
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - live_discovery.mysql_json
      - --verify-plan-marker
      - "{{ live_discovery_side_remote_dir }}/api/db-query-plan.json"
      - "{{ live_discovery_side_remote_dir }}/sql/verified-plan.json"
    chdir: "{{ live_discovery_side_remote_dir }}/scripts"
  changed_when: false

- name: Live DB JSONL | require safe verified query IDs
  ansible.builtin.assert:
    that:
      - item.query_id is match('^[0-9]{4}-[a-z_][a-z0-9_]*-[a-z_][a-z0-9_]*$')
      - item.query_id in live_discovery_db_verified_marker.query_ids
  loop: "{{ live_discovery_db_query_plan.queries }}"
  loop_control:
    label: "{{ item.query_id }}"

- name: Live DB JSONL | validate every SQL file as SELECT-only
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - live_discovery.mysql_json
      - --validate-sql
      - "{{ live_discovery_side_remote_dir }}/sql/{{ item.query_id }}.sql"
    chdir: "{{ live_discovery_side_remote_dir }}/scripts"
  loop: "{{ live_discovery_db_query_plan.queries }}"
  loop_control:
    label: "{{ item.query_id }}"
  changed_when: false

- name: Live DB JSONL | validate rendered service-user MySQL argv
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - live_discovery.argv_policy
      - --mysql-json
      - "{{ live_discovery_mysql_json_argv | to_json }}"
    chdir: "{{ live_discovery_side_remote_dir }}/scripts"
  vars:
    live_discovery_mysql_user: "{{ live_discovery_db_service_credentials[item.schema].user }}"
    live_discovery_mysql_password: >-
      {{ (lookup('file', live_discovery_kolla_passwords_file_local) | from_yaml)
         [live_discovery_db_service_credentials[item.schema].password_key] }}
  loop: "{{ live_discovery_db_query_plan.queries }}"
  loop_control:
    label: "{{ item.query_id }}"
  changed_when: false
  no_log: true

- name: Live DB JSONL | execute reviewed SELECT through argv transport
  ansible.builtin.command:
    argv: "{{ live_discovery_mysql_json_argv + ['--execute', item.sql] }}"
  environment: "{{ live_discovery_mysql_environment }}"
  vars:
    live_discovery_mysql_user: "{{ live_discovery_db_service_credentials[item.schema].user }}"
    live_discovery_mysql_password: >-
      {{ (lookup('file', live_discovery_kolla_passwords_file_local) | from_yaml)
         [live_discovery_db_service_credentials[item.schema].password_key] }}
  loop: "{{ live_discovery_db_query_plan.queries }}"
  loop_control:
    label: "{{ item.query_id }}"
  register: live_discovery_db_query_results
  changed_when: false
  failed_when: false
  no_log: "{{ live_discovery_mysql_no_log | bool }}"

- name: Live DB JSONL | persist exact JSONL output
  ansible.builtin.copy:
    dest: "{{ live_discovery_side_remote_dir }}/db-jsonl/{{ item.item.jsonl_file }}"
    mode: "0640"
    content: "{{ item.stdout }}{{ '\n' if item.stdout | length > 0 else '' }}"
  loop: "{{ live_discovery_db_query_results.results }}"
  loop_control:
    label: "{{ item.item.query_id }}"
  no_log: true

- name: Live DB JSONL | persist exact return code
  ansible.builtin.copy:
    dest: "{{ live_discovery_side_remote_dir }}/db-jsonl/{{ item.item.rc_file }}"
    mode: "0640"
    content: "{{ item.rc }}\n"
  loop: "{{ live_discovery_db_query_results.results }}"
  loop_control:
    label: "{{ item.item.query_id }}"

- name: Live DB JSONL | persist sanitized stderr separately
  ansible.builtin.copy:
    dest: "{{ live_discovery_side_remote_dir }}/db-stderr/{{ item.item.query_id }}.stderr"
    mode: "0600"
    content: "{{ item.stderr }}"
  loop: "{{ live_discovery_db_query_results.results }}"
  loop_control:
    label: "{{ item.item.query_id }}"
  no_log: true

- name: Live DB JSONL | build acquisition-bound sanitized evidence sidecars
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - live_discovery.db_evidence
      - --record-stdin
      - --out
      - "{{ live_discovery_side_remote_dir }}/db-jsonl/{{ item.item.query_id }}.evidence.json"
    chdir: "{{ live_discovery_side_remote_dir }}/scripts"
    stdin: >-
      {{ {'side': live_discovery_schema_side,
          'query_id': item.item.query_id,
          'returncode': item.rc,
          'observed_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%S.%fZ'),
          'stderr': item.stderr} | to_json }}
    stdin_add_newline: false
  loop: "{{ live_discovery_db_query_results.results }}"
  loop_control:
    label: "{{ item.item.query_id }}"
  changed_when: false
  no_log: true

- name: Live DB JSONL | retain failure set for typed combine verdict
  ansible.builtin.set_fact:
    live_discovery_db_failed_query_ids: >-
      {{ live_discovery_db_query_results.results |
         rejectattr('rc', 'equalto', 0) |
         map(attribute='item.query_id') | list }}
  no_log: true
