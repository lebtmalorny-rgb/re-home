# Unique label for audit artifacts.
rehome_id: "rehome-{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

# Compute identity. Must match Nova CONF.host and hypervisor_hostname used by source.
rehome_host: "compute-023"
hypervisor_hostname: "compute-023"
instances_path: "/var/lib/nova/instances"

# Target cell UUID. Fill after `nova-manage cell_v2 list_cells` on target.
target_cell_uuid: "REPLACE_WITH_TARGET_CELL_UUID"

# Backend: ovs, ovn, linuxbridge, sriov, hybrid.
network_backend: "ovs"

# Deployment driver. The lab uses Kolla containers on Docker, but the
# source-only service guard also supports systemd units for non-Kolla hosts.
deployment_driver: "kolla"
container_runtime_cli: "docker"

# Whether playbook 04 is allowed to run DB migrations on target.
allow_target_db_sync: false
allow_target_sql_import: false

# Host-scoped SQL files prepared and reviewed by operators.
# They are copied to the target DB node and imported in order.
target_sql_files:
  - "sql-skeleton/10-keystone-projects-users-optional.sql"
  - "sql-skeleton/20-neutron-networks-ports-sg.sql"
  - "sql-skeleton/30-cinder-volumes-attachments.sql"
  - "sql-skeleton/40-nova-api-instance-mappings-request-specs.sql"
  - "sql-skeleton/50-nova-cell-instances-bdm-info-cache.sql"
  - "sql-skeleton/60-nova-cell-compute-nodes-services-if-needed.sql"

# Read-only schema compatibility check commands. Override these for Kolla or
# any environment where management commands run inside containers.
schema_compat_db_names: "{{ target_db_names }}"
schema_compat_report_dir: "{{ rehome_stage_dir }}/schema-compat"
schema_compat_local_artifact_dir: "{{ playbook_dir }}/../artifacts/schema-compat/{{ source_cluster_name | default('source') }}-to-{{ target_cluster_name | default('target') }}"
schema_compat_nova_manage_command: "nova-manage"
schema_compat_neutron_db_manage_command: "neutron-db-manage"
schema_compat_cinder_manage_command: "cinder-manage"
schema_compat_cinder_enabled: true
schema_compat_mysql_query_command: "mysql --defaults-extra-file={{ mysql_defaults_file | quote }} --batch --raw --skip-column-names"
schema_compat_mysql_query_user: "root"
schema_compat_mysql_host: "127.0.0.1"
schema_compat_mysql_query_no_log: false
schema_compat_kolla_database_password_key: "database_password"
schema_compat_mysql_service_queries: []

# MariaDB DB names. Adjust cell DB name(s).
source_db_names:
  - keystone
  - nova_api
  - nova_cell0
  - nova
  - neutron
  - cinder
  - placement
target_db_names:
  - keystone
  - nova_api
  - nova_cell0
  - nova
  - neutron
  - cinder
  - placement

# Source DB row collector used after target API prep and DB import planning.
# Set service users/password keys in environment-specific inventory.
source_db_rows_nova_cell_db_name: "nova"
source_db_row_service_queries: []

# Services on the compute host are intentionally split into three groups.
# 1. source_only_*: explicitly approved non-runtime services present only in CP-A.
#    They may be stopped before cutover, one by one, with VM runtime guards.
# 2. *_runtime_switch_*: services switched only inside the cutover window.
# 3. dataplane_keep_*: services that must not be stopped during re-home.
source_only_containers: []
source_only_systemd_units: []
ignored_source_containers: []
ignored_source_systemd_units: []

source_runtime_switch_containers:
  - nova_compute
  - neutron_openvswitch_agent
  - ovn_controller

target_runtime_switch_containers:
  - neutron_openvswitch_agent
  - ovn_controller
  - nova_compute

source_runtime_switch_systemd_units:
  - nova-compute
  - neutron-openvswitch-agent
  - ovn-controller

target_runtime_switch_systemd_units:
  - neutron-openvswitch-agent
  - ovn-controller
  - nova-compute

dataplane_keep_containers:
  - nova_libvirt
  - openvswitch_db
  - openvswitch_vswitchd
  - iscsid
  - multipathd

dataplane_keep_systemd_units:
  - libvirtd
  - virtqemud
  - openvswitch
  - openvswitch-switch
  - iscsid
  - multipathd

# Backward-compatible generic names used by the original skeleton playbooks.
source_compute_units: "{{ source_runtime_switch_systemd_units }}"
target_compute_units: "{{ target_runtime_switch_systemd_units }}"

# Runtime guard. Keep probe targets empty in a generic inventory; set them in a
# lab or production inventory to one or more VM IPs that must stay reachable.
runtime_guard_enabled: true
runtime_guard_compare_domain_interfaces: true
runtime_guard_compare_ovs_ports: false
runtime_guard_virsh_command: "virsh"
runtime_guard_ping_count: 3
runtime_guard_ping_timeout: 1
runtime_guard_probe_delegate: "{{ inventory_hostname }}"
runtime_guard_probe_targets: []

# Safe-mode Nova options for first target boot.
nova_safe_mode:
  running_deleted_instance_action: noop
  running_deleted_instance_poll_interval: 0
  sync_power_state_interval: -1
  resume_guests_state_on_host_boot: false
  enable_new_services: false
  handle_virt_lifecycle_events: false

# Paths on compute.
rehome_stage_dir: "/var/tmp/openstack-rehome"
source_config_backup_dir: "/var/tmp/openstack-rehome/source-config-backup"
target_config_stage_dir: "/var/tmp/openstack-rehome/target-config-stage"

# Local artifact path on the Ansible runner.
local_artifact_dir: "{{ playbook_dir }}/../artifacts/{{ rehome_host }}"

# Manifest collection. For Kolla, provide local generated clouds.yaml files and
# run OpenStack CLI through kolla_toolbox on source/target control nodes.
manifest_remote_dir: "{{ rehome_stage_dir }}/manifest"
source_clouds_file_local: ""
target_clouds_file_local: ""
source_cloud_name: "{{ source_os_cloud }}"
target_cloud_name: "{{ target_os_cloud }}"
openstack_cli_container: "kolla_toolbox"

# OpenStack CLI environment mode.
# Either use OS_CLOUD values or source openrc files in shell commands.
source_os_cloud: "source-admin"
target_os_cloud: "target-admin"
use_os_cloud: true

# Optional: list of instances and ports after manifest generation.
manifest_file: "{{ local_artifact_dir }}/rehome_manifest.yml"

# Live read-only discovery. The live cluster is the source of truth; SQL dumps
# are not accepted by this orchestration. Protected inputs are operator-owned,
# run-local files and must not be placed below the normal artifact directory.
live_discovery_enabled: true
live_discovery_run_id: ""
live_discovery_target_profile: "vanilla-openstack-2025.1-epoxy"
live_discovery_remote_dir: "{{ rehome_stage_dir }}/live-discovery"
live_discovery_local_dir: "{{ local_artifact_dir }}/live-discovery"
live_discovery_schema_policy_file: "{{ playbook_dir }}/../inventory/live-discovery-schema-policy.json"
live_discovery_mysql_json_command: "mysql --batch --raw --skip-column-names"
live_discovery_mysql_json_argv:
  - mysql
  - --batch
  - --raw
  - --skip-column-names
live_discovery_mysql_environment: {}
live_discovery_mysql_no_log: true
live_discovery_kolla_passwords_file_local: "{{ schema_compat_kolla_passwords_file_local | default('') }}"
live_discovery_schema_mysql_user: root
live_discovery_schema_mysql_password_key: database_password
live_discovery_db_service_credentials:
  nova_api: {user: nova_api, password_key: nova_api_database_password}
  nova: {user: nova, password_key: nova_database_password}
  neutron: {user: neutron, password_key: neutron_database_password}
  cinder: {user: cinder, password_key: cinder_database_password}
live_discovery_storage_backend_kind: ""
live_discovery_storage_backend_kinds: []
live_discovery_source_storage_probe_host: ""
live_discovery_target_storage_probe_host: ""
# Backend profiles are deliberately data, not a hard-coded NFS branch. A
# profile without read_only_probe_argv remains visible as UNKNOWN.
live_discovery_storage_backends: {}
live_discovery_storage_backend_templates:
  nfs:
    supported: true
    read_only_probe_argv: [stat, --format, "%s"]
  rbd:
    supported: true
    read_only_probe_argv: [rbd, info, --format, json]
  lvm:
    supported: true
    read_only_probe_argv: [lvs, --reportformat, json, --units, b, --nosuffix]
  vendor:
    supported: false
    read_only_probe_argv: []
live_discovery_storage_probe_commands:
  source: []
  target: []
live_discovery_target_virsh_command: "virsh"
live_discovery_target_qemu_command: "qemu-system-x86_64"
live_discovery_source_virsh_argv: [virsh]
live_discovery_target_virsh_argv: [virsh]
live_discovery_target_qemu_argv: [qemu-system-x86_64]
live_discovery_glance_range_probe_enabled: true
live_discovery_fail_on_not_ready: true

# Externally anchored protected inputs. Paths stay empty in generic inventory
# so preflight fails before any remote command. The HMAC key must contain at
# least 16 bytes. Probe configs may reference the ephemeral Glance token only
# through token_file or token_env; never embed its value.
live_discovery_phase_hmac_key_file_local: ""
# Root manifests are derived from the first live source API phase. There is no
# operator-supplied/dump-backed root manifest input.
live_discovery_source_probe_config_file_local: ""
live_discovery_target_probe_config_file_local: ""
live_discovery_source_cinder_sensitive_evidence_file_local: ""
live_discovery_target_cinder_sensitive_evidence_file_local: ""
live_discovery_glance_token_file_local: ""

# Kolla/container-aware command argv can be overridden per inventory without
# using shell interpolation. These are version/current/show/inspect probes only.
live_discovery_nova_api_db_version_argv: [nova-manage, api_db, version]
live_discovery_nova_cell_db_version_argv: [nova-manage, db, version]
live_discovery_neutron_db_version_argv: [neutron-db-manage, current, --verbose]
live_discovery_cinder_db_version_argv: [cinder-manage, db, version]
live_discovery_container_inspect_argv_prefix: [docker, inspect]
live_discovery_profile_containers:
  - nova_api
  - neutron_server
  - cinder_api
  - glance_api
